<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员登录 - WatchPatrol 巡哨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 图标库（国内高速 CDN 加速） -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">
  
  <!-- 背景科技光斑 -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
  </div>

  <!-- 登录卡片 -->
  <div class="relative z-10 w-full max-w-md bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-8 shadow-2xl">
    
    <!-- 头部图标与标题 -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 mb-4">
        <i class="fa-solid fa-shield-halved text-2xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">WatchPatrol <span class="text-lg font-normal text-slate-400">· 巡哨</span></h2>
      <p class="text-xs text-slate-400 mt-1.5">系统已开启安全访问认证，请输入管理员账号凭证</p>
    </div>

    <!-- 错误警告提示框 -->
    <div id="error-box" class="hidden mb-6 p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs flex items-center space-x-2">
      <i class="fa-solid fa-circle-exclamation text-sm shrink-0"></i>
      <span id="error-msg">账号或密码错误，请重新输入</span>
    </div>

    <!-- 登录表单 -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          管理员账号
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
            <i class="fa-solid fa-user text-sm"></i>
          </span>
          <input
            id="username"
            name="username"
            type="text"
            required
            autocomplete="username"
            placeholder="请输入管理员账号"
            class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          登录密码
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
            <i class="fa-solid fa-lock text-sm"></i>
          </span>
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="请输入管理员密码"
            class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
          />
        </div>
      </div>

      <div class="pt-2">
        <button
          id="btn-submit"
          type="submit"
          class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/25 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-slate-800 active:scale-[0.98] flex items-center justify-center space-x-2"
        >
          <span id="btn-spinner" class="hidden"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
          <span id="btn-text">登 录 平 台</span>
        </button>
      </div>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-700/50 text-center">
      <p class="text-[11px] text-slate-500">
        凭据由服务器环境变量 <code class="text-indigo-400">ADMIN_PASSWORD</code> 控制
      </p>
    </div>

  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();
      const errBox = document.getElementById("error-box");
      const errMsg = document.getElementById("error-msg");
      const btn = document.getElementById("btn-submit");
      const spinner = document.getElementById("btn-spinner");
      const text = document.getElementById("btn-text");

      errBox.classList.add("hidden");
      btn.disabled = true;
      spinner.classList.remove("hidden");
      text.innerText = "验证中...";

      try {
        const formData = new URLSearchParams();
        formData.append("username", user);
        formData.append("password", pass);

        const resp = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData,
        });

        const data = await resp.json();
        if (resp.ok && data.success) {
          text.innerText = "登录成功，正在跳转...";
          const urlParams = new URLSearchParams(window.location.search);
          const nextUrl = urlParams.get("next") || "/";
          window.location.href = nextUrl;
        } else {
          errMsg.innerText = data.error || "账号或密码错误，请核对后重试";
          errBox.classList.remove("hidden");
          btn.disabled = false;
          spinner.classList.add("hidden");
          text.innerText = "登 录 平 台";
        }
      } catch (err) {
        errMsg.innerText = "网络请求失败，请检查服务状态";
        errBox.classList.remove("hidden");
        btn.disabled = false;
        spinner.classList.add("hidden");
        text.innerText = "登 录 平 台";
      }
    }
  </script>
</body>
</html>
